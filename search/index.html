<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Prototype | Sonic the Comic Rescan Project</title>
  
  <link rel="stylesheet" href="../style.css">
  
  <style>
    .search-hero {
      padding: 40px 20px;
      text-align: center;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 40px;
    }
    
    .search-container {
      position: relative;
      max-width: 600px;
      margin: 0 auto 20px auto;
    }
    
    #search-input {
      width: 100%;
      padding: 16px;
      box-sizing: border-box;
      font-size: 18px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      background: var(--surface-1);
      color: var(--text-1);
    }
    
    #search-input:focus {
      outline: none;
      border-color: var(--brand-primary);
    }
    
    .autocomplete-items {
      position: absolute;
      border: 1px solid var(--border-color);
      border-top: none;
      z-index: 99;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--surface-1);
      max-height: 300px;
      overflow-y: auto;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      text-align: left;
    }
    
    .autocomplete-items div {
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-1);
    }
    
    .autocomplete-items div:hover {
      background-color: var(--surface-2);
    }
    
    .context-label {
      font-size: 12px;
      color: var(--text-2);
      background: var(--surface-3);
      padding: 4px 8px;
      border-radius: 4px;
      margin-left: 10px;
      text-transform: uppercase;
      font-weight: bold;
    }
    
    .selected-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: center;
    }
    
    .tag {
      background-color: var(--brand-primary);
      color: var(--text-1);
      padding: 8px 16px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      font-size: 14px;
      font-weight: 500;
    }
    
    .tag-close {
      margin-left: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 18px;
      line-height: 1;
      opacity: 0.7;
    }
    
    .tag-close:hover {
      opacity: 1;
    }

    .no-results {
      text-align: center;
      grid-column: 1 / -1;
      color: var(--text-2);
      font-size: 18px;
      padding: 40px;
    }
  </style>
</head>
<body>
  
  <!-- Add a minimal header similar to the site -->
  <header style="background: var(--surface-1); padding: 15px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: center;">
    <a href="../index.html">
      <img src="../images/stc-rp-logo.svg" alt="Sonic the Comic Rescan Project Logo" style="height: 40px;" />
    </a>
  </header>

  <div class="search-hero">
    <div class="container">
      <h1 style="margin-bottom: 20px; color: var(--text-1);">Search Archive</h1>
      
      <div class="search-container">
        <input type="text" id="search-input" placeholder="Search by character, artist, writer..." autocomplete="off">
        <div id="autocomplete-list" class="autocomplete-items"></div>
      </div>
      
      <div id="selected-tags" class="selected-tags"></div>
    </div>
  </div>

  <section class="content-panel container">
    <div class="grid" id="results-container"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
